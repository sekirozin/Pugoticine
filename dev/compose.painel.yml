# Cópia isolada para testar o Painel sem tocar no ambiente do player (3012/3015).
#   PUGOTICINE_MIDIA=~/IA/Fontes/Pugoticine-midia-teste docker compose -p pugoticine-painel -f dev/compose.painel.yml up -d --build
#   Pugoticine: http://127.0.0.1:3022 · login de desenvolvimento: http://127.0.0.1:3025/auth
services:
  pugoticine:
    build: ..
    image: pugoticine:painel
    ports:
      - "127.0.0.1:3022:3012"
    environment:
      PORT: "3012"
      MEDIA_ROOT: "/media/movies"
      DATA_DIR: "/app/data"
      DB_FILE: "/app/data/pugoticine.db"
      PUGOTILAB_PROFILE_URL: "http://login-dev:8080/auth/api/profile"
      PUGOTILAB_LOGIN_URL: "http://127.0.0.1:3025/auth"
      SCAN_INTERVAL_MS: "900000"
      TZ: "America/Maceio"
    volumes:
      - pugoticine-painel-dados:/app/data
      - ${PUGOTICINE_MIDIA:?Defina a pasta de mídia de teste}/Filmes:/media/movies:ro
      # Pasta inteira de teste, para criar outras bibliotecas pelo Painel (Animes, Séries...).
      - ${PUGOTICINE_MIDIA}:/media/teste:ro
    depends_on:
      - login-dev
    restart: "no"
  login-dev:
    image: node:20-alpine
    command: ["node", "/login/servidor.mjs"]
    volumes:
      - ./login-dev:/login:ro
    ports:
      - "127.0.0.1:3025:8080"
    restart: "no"
volumes:
  pugoticine-painel-dados:
