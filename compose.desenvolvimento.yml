# Desenvolvimento do PugotiCine no notebook (substitui a referência Jellyfin, removida em 03/11).
#   PUGOTICINE_MIDIA=~/IA/Fontes/Pugoticine-midia-teste docker compose -f compose.desenvolvimento.yml up -d --build
#   PugotiCine: http://127.0.0.1:3012   ·   login de desenvolvimento (no lugar do PugotiLab): http://127.0.0.1:3015/auth
services:
  pugoticine:
    build: .
    image: pugoticine:desenvolvimento
    ports:
      - "127.0.0.1:3012:3012"
    environment:
      PORT: "3012"
      MEDIA_ROOT: "/media/movies"
      DATA_DIR: "/app/data"
      DB_FILE: "/app/data/pugoticine.db"
      PUGOTILAB_PROFILE_URL: "http://login-dev:8080/auth/api/profile"
      PUGOTILAB_LOGIN_URL: "http://127.0.0.1:3015/auth"
      SCAN_INTERVAL_MS: "60000"
      PUGOTICINE_ACELERACAO: "vaapi"
      # Metadados do TMDB (opcional): exporte TMDB_READ_TOKEN antes de subir; sem ele, só Radarr/quadros do vídeo.
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      TZ: "America/Maceio"
    volumes:
      - pugoticine-dados:/app/data
      - ${PUGOTICINE_MIDIA:?Defina a pasta de mídia de teste}/Filmes:/media/movies:ro
      # Pasta de teste inteira (Filmes, Animes) para o Painel › Bibliotecas escolher pastas.
      - ${PUGOTICINE_MIDIA}:/media/teste:ro
    # GPU para a conversão (VAAPI); sem /dev/dri o PugotiCine detecta e converte por software.
    devices:
      - /dev/dri:/dev/dri
    depends_on:
      - login-dev
    restart: "no"
  login-dev:
    image: node:20-alpine
    command: ["node", "/login/servidor.mjs"]
    volumes:
      - ./dev/login-dev:/login:ro
    ports:
      - "127.0.0.1:3015:8080"
    restart: "no"
volumes:
  pugoticine-dados:
