<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Pugoticine</title>
  <link rel="icon" href="/pugoticine-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-button menu-toggle" id="menu-toggle" aria-label="Abrir menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <button class="brand" id="brand" aria-label="Ir para o início">
      <img src="/pugoticine-icon.svg" alt="">
      <strong>Pugoticine</strong>
    </button>
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="search" type="search" placeholder="Pesquisar filmes" autocomplete="off">
    </label>
    <button class="profile-button" id="profile-button" aria-label="Perfil"><span id="avatar-fallback">P</span><img id="avatar" alt=""></button>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Navegação">
    <nav>
      <button class="nav-item active" data-view="home"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Início</span></button>
      <button class="nav-item" data-view="movies"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="m7 5 2-3m4 3 2-3m4 3 2-3M3 10h18"/></svg><span>Filmes</span></button>
      <button class="nav-item" data-view="continue"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/></svg><span>Continuar</span></button>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item admin-only" id="scan-button" hidden><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v6h-6"/></svg><span>Atualizar catálogo</span></button>
      <button class="nav-item danger" id="logout"><svg viewBox="0 0 24 24"><path d="M10 17l5-5-5-5m5 5H3m11-9h6a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-6"/></svg><span>Sair</span></button>
    </div>
  </aside>
  <button class="scrim" id="scrim" aria-label="Fechar menu"></button>

  <main id="content" class="content"><div class="loading">Carregando sua biblioteca...</div></main>

  <div class="profile-menu" id="profile-menu" hidden>
    <strong id="profile-name">Pugotilab</strong>
    <small id="profile-username"></small>
    <a id="profile-open" href="https://pugotilab.com/auth/profile">Perfil</a>
    <button id="profile-logout">Sair</button>
  </div>

  <div class="player-modal" id="player-modal" hidden>
    <div class="player-shell">
      <div class="player-heading"><div><h2 id="player-title"></h2><p id="player-meta"></p></div><button class="icon-button" id="player-close" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></svg></button></div>
      <div class="player-controls">
        <label><span>Qualidade</span><select id="player-quality"><option value="auto">Automática</option><option value="original">Original</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option></select></label>
        <label><span>Áudio</span><select id="player-audio"><option>Analisando...</option></select></label>
        <label><span>Legenda</span><select id="player-subtitle"><option value="none">Desativada</option></select></label>
        <span class="player-mode" id="player-mode">Analisando</span>
      </div>
      <video id="player" controls playsinline preload="metadata"></video>
      <p class="player-status" id="player-status"></p>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="/vendor/hls.min.js"></script>
  <script src="/app.js" type="module"></script>
  <script src="/ambient-effects.js?v=20260813" defer></script>
</body>
</html>
