<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Pugoticine</title>
  <script src="/temas.js"></script>
  <!-- Ícone PU/CI (padrão dos serviços Pugoti). -->
  <link rel="icon" href="/pugoticine-icon.svg?v=puci" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/salas.css">
  <link rel="stylesheet" href="/temas.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-button menu-toggle" id="menu-toggle" aria-label="Abrir menu">
      <svg data-icone="menu-2" class="icone-tabler" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6l16 0" /><path d="M4 12l16 0" /><path d="M4 18l16 0" /></svg>
    </button>
    <button class="brand" id="brand" aria-label="Ir para o início">
      <img src="/pugoticine-icon.svg?v=puci" alt="">
      <strong>Pugoticine</strong>
    </button>
    <label class="search">
      <svg data-icone="search" class="icone-tabler" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M21 21l-6 -6" /></svg>
      <input id="search" type="search" placeholder="Pesquisar filmes" autocomplete="off">
    </label>
    <button class="profile-button" id="profile-button" aria-label="Perfil"><span id="avatar-fallback">P</span><img id="avatar" alt=""></button>
  </header>

  <aside class="sidebar" id="sidebar" aria-label="Navegação">
    <nav>
      <button class="nav-item active" data-view="home"><svg data-icone="home" class="icone-tabler" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l-2 0l9 -9l9 9l-2 0" /><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7" /><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6" /></svg><span>Início</span></button>
      <!-- Uma entrada por biblioteca (Painel › Bibliotecas), montada pelo app.js. -->
      <div class="nav-bibliotecas" id="nav-bibliotecas"></div>
      <button class="nav-item admin-only" data-view="painel" id="painel-button" hidden><svg data-icone="layout-dashboard" class="icone-tabler" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-6a1 1 0 0 1 1 -1" /><path d="M5 16h4a1 1 0 0 1 1 1v2a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-2a1 1 0 0 1 1 -1" /><path d="M15 12h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-6a1 1 0 0 1 1 -1" /><path d="M15 4h4a1 1 0 0 1 1 1v2a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1v-2a1 1 0 0 1 1 -1" /></svg><span>Painel</span></button>
      <button class="nav-item" data-view="continue"><svg data-icone="clock-play" class="icone-tabler" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7v5l2 2" /><path d="M17 22l5 -3l-5 -3z" /><path d="M13.017 20.943a9 9 0 1 1 7.831 -7.292" /></svg><span>Continuar</span></button>
    </nav>
    <div class="sidebar-footer">
      <button class="nav-item admin-only" id="scan-button" hidden><svg data-icone="refresh" class="icone-tabler" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" /><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" /></svg><span>Atualizar catálogo</span></button>
      <button class="nav-item danger" id="logout"><svg data-icone="logout" class="icone-tabler" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" /><path d="M9 12h12l-3 -3" /><path d="M18 15l3 -3" /></svg><span>Sair</span></button>
    </div>
  </aside>
  <button class="scrim" id="scrim" aria-label="Fechar menu"></button>

  <main id="content" class="content"><div class="loading">Carregando sua biblioteca...</div></main>

  <div class="profile-menu" id="profile-menu" hidden>
    <strong id="profile-name">Pugotilab</strong>
    <small id="profile-username"></small>
    <a id="profile-open" href="https://pugotilab.com/auth/profile">Perfil</a>
    <button id="profile-logout">Sair</button>
  </div>

  <!-- Player em tela cheia no estilo do Jellyfin (controllers/playback/video): barra superior, progresso e controles
       que somem depois de 3 s parado. A interface fica em player-osd.js; os seletores escondidos guardam as escolhas
       de qualidade, áudio e legenda que o app.js usa para pedir a reprodução. -->
  <div class="player-modal" id="player-modal" hidden>
    <video id="player" playsinline preload="metadata"></video>
    <div class="osd" id="player-osd">
      <div class="osd-topo">
        <button class="osd-botao" id="player-close" type="button" title="Voltar (Esc)" aria-label="Voltar"><svg data-icone="arrow-left" class="icone-tabler osd-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l14 0" /><path d="M5 12l6 6" /><path d="M5 12l6 -6" /></svg></button>
        <div class="osd-titulo"><h2 id="player-title"></h2><p id="player-meta"></p></div>
        <div class="osd-acoes-topo" id="player-acoes-topo"></div>
      </div>
      <div class="osd-centro"><p class="osd-status" id="player-status" role="status" aria-live="polite"></p></div>
      <div class="osd-base">
        <div class="osd-progresso">
          <span class="osd-tempo" id="osd-atual">0:00</span>
          <div class="osd-barra">
            <div class="osd-buffer" id="osd-buffer"></div>
            <input type="range" id="osd-posicao" min="0" max="1000" step="0.1" value="0" aria-label="Posição">
            <span class="osd-dica" id="osd-dica" hidden></span>
          </div>
          <span class="osd-tempo" id="osd-restante">-0:00</span>
        </div>
        <div class="osd-botoes">
          <button class="osd-botao" id="osd-voltar" type="button" title="Voltar 10 s (J)" aria-label="Voltar 10 segundos"><svg data-icone="rewind-backward-10" class="icone-tabler osd-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9l-3 -3l3 -3" /><path d="M15.997 17.918a6.002 6.002 0 0 0 -.997 -11.918h-11" /><path d="M6 14v6" /><path d="M9 15.5v3a1.5 1.5 0 0 0 3 0v-3a1.5 1.5 0 0 0 -3 0z" /></svg></button>
          <button class="osd-botao" id="osd-play" type="button" title="Reproduzir (K)" aria-label="Reproduzir"><svg data-icone="player-play-cheio" class="icone-tabler-cheio osd-icone" id="osd-play-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4v16a1 1 0 0 0 1.524 .852l13 -8a1 1 0 0 0 0 -1.704l-13 -8a1 1 0 0 0 -1.524 .852z" /></svg></button>
          <button class="osd-botao" id="osd-avancar" type="button" title="Avançar 30 s (L)" aria-label="Avançar 30 segundos"><svg data-icone="rewind-forward-30" class="icone-tabler osd-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.007 16.478a6 6 0 0 1 3.993 -10.478h11" /><path d="M15 15.5v3a1.5 1.5 0 0 0 3 0v-3a1.5 1.5 0 0 0 -3 0z" /><path d="M17 9l3 -3l-3 -3" /><path d="M9 14h1.5a1.5 1.5 0 0 1 0 3h-.5h.5a1.5 1.5 0 0 1 0 3h-1.5" /></svg></button>
          <span class="osd-termina" id="osd-termina"></span>
          <span class="osd-espaco"></span>
          <button class="osd-botao" id="osd-legendas" type="button" title="Legendas" aria-label="Legendas"><svg data-icone="badge-cc" class="icone-tabler osd-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5m0 2a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z" /><path d="M10 10.5a1.5 1.5 0 0 0 -3 0v3a1.5 1.5 0 0 0 3 0" /><path d="M17 10.5a1.5 1.5 0 0 0 -3 0v3a1.5 1.5 0 0 0 3 0" /></svg></button>
          <button class="osd-botao" id="osd-audio" type="button" title="Áudio" aria-label="Áudio"><svg data-icone="music" class="icone-tabler osd-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M13 17a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /><path d="M9 17v-13h10v13" /><path d="M9 8h10" /></svg></button>
          <button class="osd-botao" id="osd-mudo" type="button" title="Mudo (M)" aria-label="Mudo"><svg data-icone="volume" class="icone-tabler osd-icone" id="osd-volume-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 8a5 5 0 0 1 0 8" /><path d="M17.7 5a9 9 0 0 1 0 14" /><path d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5" /></svg></button>
          <input class="osd-volume" type="range" id="osd-volume" min="0" max="100" step="1" value="100" aria-label="Volume">
          <button class="osd-botao" id="osd-config" type="button" title="Configurações" aria-label="Configurações"><svg data-icone="settings" class="icone-tabler osd-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z" /><path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" /></svg></button>
          <button class="osd-botao" id="osd-pip" type="button" title="Vídeo destacado (picture-in-picture)" aria-label="Vídeo destacado" hidden><svg data-icone="picture-in-picture" class="icone-tabler osd-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 19h-6a2 2 0 0 1 -2 -2v-10a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v4" /><path d="M14 14m0 1a1 1 0 0 1 1 -1h5a1 1 0 0 1 1 1v3a1 1 0 0 1 -1 1h-5a1 1 0 0 1 -1 -1z" /></svg></button>
          <button class="osd-botao" id="osd-tela-cheia" type="button" title="Tela cheia (F)" aria-label="Tela cheia"><svg data-icone="maximize" class="icone-tabler osd-icone" id="osd-tela-cheia-icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8v-2a2 2 0 0 1 2 -2h2" /><path d="M4 16v2a2 2 0 0 0 2 2h2" /><path d="M16 4h2a2 2 0 0 1 2 2v2" /><path d="M16 20h2a2 2 0 0 0 2 -2v-2" /></svg></button>
        </div>
      </div>
      <div class="osd-menu" id="osd-menu" role="menu" hidden></div>
      <div class="osd-info" id="osd-info" hidden></div>
    </div>
    <div class="osd-escolhas" hidden>
      <select id="player-quality"><option value="auto">Automática</option><option value="original">Original</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option></select>
      <select id="player-audio"><option>Analisando...</option></select>
      <select id="player-subtitle"><option value="none">Desativada</option></select>
      <span id="player-mode">Analisando</span>
    </div>
  </div>
  <div class="toast" id="toast" hidden></div>

  <script src="/vendor/hls.min.js"></script>
  <script src="/app.js" type="module"></script>
  <script src="/icones.js" type="module"></script>
  <script src="/salas.js" defer></script>
  <script src="/ambient-effects.js?v=20261103" defer></script>
</body>
</html>
